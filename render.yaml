# Render blueprint for the FastAPI backend (the frontend is on Vercel).
# Built from the repo root: the backend reads config/ and scenarios/ from here.
services:
  - type: web
    name: apextrace-api
    runtime: python
    plan: free
    # Warm the result cache at build time (all build CPUs, ~5 min) so it ships
    # with the deploy; otherwise every boot recomputes it on the instance's
    # tiny CPU share for many minutes and live driving stutters.
    buildCommand: pip install -r backend/requirements.txt && cd backend && EVAL_WORKERS= python scripts/warm_cache.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Frontend origins: custom domain plus Vercel production and preview URLs
      - key: CORS_ORIGIN_REGEX
        value: https://(apex\.bhalla\.info|apextrace[a-z0-9-]*\.vercel\.app)
      - key: EVAL_WORKERS
        value: "1"
